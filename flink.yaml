apiVersion: v1
kind: Namespace
metadata:
  name: flink
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flink-connector-init
  namespace: flink
  labels:
    app: flink
data:
  install-connectors.sh: |
    #!/bin/sh
    set -eu
    cd /opt/flink/usrlib
    fetch() {
      url="$1"
      file="$2"
      if [ ! -f "$file" ]; then
        echo "downloading $file"
        curl -fsSL "$url" -o "$file"
      fi
    }
    fetch "https://repo1.maven.org/maven2/org/apache/flink/flink-sql-connector-kafka/5.0.0-2.2/flink-sql-connector-kafka-5.0.0-2.2.jar" \
          "flink-sql-connector-kafka-5.0.0-2.2.jar"
    fetch "https://repo1.maven.org/maven2/org/apache/iceberg/iceberg-flink-runtime-2.1/1.11.0/iceberg-flink-runtime-2.1-1.11.0.jar" \
          "iceberg-flink-runtime-2.1-1.11.0.jar"
    fetch "https://repo1.maven.org/maven2/org/apache/iceberg/iceberg-aws-bundle/1.11.0/iceberg-aws-bundle-1.11.0.jar" \
          "iceberg-aws-bundle-1.11.0.jar"
    fetch "https://repo1.maven.org/maven2/org/apache/flink/flink-shaded-hadoop-2-uber/2.8.3-9.0/flink-shaded-hadoop-2-uber-2.8.3-9.0.jar" \
          "flink-shaded-hadoop-2-uber-2.8.3-9.0.jar"
    ls -la /opt/flink/usrlib
  copy-to-lib.sh: |
    #!/bin/sh
    set -eu
    cp /opt/flink/usrlib/*.jar /opt/flink/lib/
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flink-config
  namespace: flink
  labels:
    app: flink
data:
  config.yaml: |+
    jobmanager.rpc.address: flink-jobmanager
    taskmanager.numberOfTaskSlots: 1
    blob.server.port: 6124
    jobmanager.rpc.port: 6123
    taskmanager.rpc.port: 6122
    jobmanager.memory.process.size: 1024m
    taskmanager.memory.process.size: 1024m
    parallelism.default: 1
    env.java.opts.all: "--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED"
  log4j-console.properties: |+
    rootLogger.level = INFO
    rootLogger.appenderRef.console.ref = ConsoleAppender
    appender.console.name = ConsoleAppender
    appender.console.type = CONSOLE
    appender.console.layout.type = PatternLayout
    appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n
---
apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
  namespace: flink
  labels:
    app: flink
    component: jobmanager
spec:
  type: ClusterIP
  selector:
    app: flink
    component: jobmanager
  ports:
    - name: rpc
      port: 6123
      targetPort: 6123
    - name: blob-server
      port: 6124
      targetPort: 6124
    - name: webui
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-jobmanager
  namespace: flink
  labels:
    app: flink
    component: jobmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink
      component: jobmanager
  template:
    metadata:
      labels:
        app: flink
        component: jobmanager
    spec:
      initContainers:
        - name: install-connectors
          image: curlimages/curl:8.5.0
          command: ["/bin/sh", "/scripts/install-connectors.sh"]
          volumeMounts:
            - name: flink-usrlib
              mountPath: /opt/flink/usrlib
            - name: connector-init
              mountPath: /scripts
      containers:
        - name: jobmanager
          image: apache/flink:2.3.0-java17
          command: ["/bin/bash", "-c"]
          args:
            - |
              /scripts/copy-to-lib.sh
              exec /docker-entrypoint.sh jobmanager
          ports:
            - containerPort: 6123
              name: rpc
            - containerPort: 6124
              name: blob-server
            - containerPort: 8081
              name: webui
          readinessProbe:
            httpGet:
              path: /overview
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6123
            initialDelaySeconds: 30
            periodSeconds: 60
          volumeMounts:
            - name: flink-config-volume
              mountPath: /opt/flink/conf
            - name: flink-usrlib
              mountPath: /opt/flink/usrlib
            - name: connector-init
              mountPath: /scripts
          securityContext:
            runAsUser: 9999
          resources:
            requests:
              memory: "768Mi"
              cpu: "250m"
            limits:
              memory: "1280Mi"
              cpu: "1000m"
      volumes:
        - name: flink-config-volume
          configMap:
            name: flink-config
            items:
              - key: config.yaml
                path: config.yaml
              - key: log4j-console.properties
                path: log4j-console.properties
        - name: flink-usrlib
          emptyDir: {}
        - name: connector-init
          configMap:
            name: flink-connector-init
            defaultMode: 0755
            items:
              - key: install-connectors.sh
                path: install-connectors.sh
              - key: copy-to-lib.sh
                path: copy-to-lib.sh
---
apiVersion: apps/v1
kind: Deployment
