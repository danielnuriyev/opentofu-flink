apiVersion: v1
kind: Namespace
metadata:
  name: flink
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: flink
type: Opaque
stringData:
  accesskey: admin
  secretkey: password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flink-connector-init
  namespace: flink
  labels:
    app: flink
data:
  install-connectors.sh: |
    #!/bin/sh
    set -eu
    cd /opt/flink/usrlib
    fetch() {
      url="$1"
      file="$2"
      if [ ! -f "$file" ]; then
        echo "downloading $file"
        curl -fsSL "$url" -o "$file"
      fi
    }
    fetch "https://repo1.maven.org/maven2/org/apache/flink/flink-sql-connector-kafka/5.0.0-2.2/flink-sql-connector-kafka-5.0.0-2.2.jar" \
          "flink-sql-connector-kafka-5.0.0-2.2.jar"
    fetch "https://repo1.maven.org/maven2/org/apache/iceberg/iceberg-flink-runtime-2.1/1.11.0/iceberg-flink-runtime-2.1-1.11.0.jar" \
          "iceberg-flink-runtime-2.1-1.11.0.jar"
    fetch "https://repo1.maven.org/maven2/org/apache/iceberg/iceberg-aws-bundle/1.11.0/iceberg-aws-bundle-1.11.0.jar" \
          "iceberg-aws-bundle-1.11.0.jar"
    fetch "https://repo1.maven.org/maven2/org/apache/flink/flink-shaded-hadoop-2-uber/2.8.3-9.0/flink-shaded-hadoop-2-uber-2.8.3-9.0.jar" \
          "flink-shaded-hadoop-2-uber-2.8.3-9.0.jar"
    ls -la /opt/flink/usrlib
  copy-to-lib.sh: |
    #!/bin/sh
    set -eu
    cp /opt/flink/usrlib/*.jar /opt/flink/lib/
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flink-config
  namespace: flink
  labels:
    app: flink
data:
  config.yaml: |+
    jobmanager.rpc.address: flink-jobmanager
    taskmanager.numberOfTaskSlots: 1
    blob.server.port: 6124
    jobmanager.rpc.port: 6123
    taskmanager.rpc.port: 6122
    jobmanager.memory.process.size: 1024m
    taskmanager.memory.process.size: 1024m
    parallelism.default: 1
    env.java.opts.all: "--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED -Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.port=9999 -Dcom.sun.management.jmxremote.rmi.port=9999 -Dcom.sun.management.jmxremote.local.only=true -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=127.0.0.1"
  log4j-console.properties: |+
    rootLogger.level = INFO
    rootLogger.appenderRef.file.ref = MainAppender
    appender.file.name = MainAppender
    appender.file.type = RollingFile
    appender.file.append = true
    appender.file.fileName = /var/log/flink/flink.log
    appender.file.filePattern = /var/log/flink/flink-%i.log
    appender.file.layout.type = PatternLayout
    appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n
    appender.file.policies.type = Policies
    appender.file.policies.size.type = SizeBasedTriggeringPolicy
    appender.file.policies.size.size = 100MB
    appender.file.strategy.type = DefaultRolloverStrategy
    appender.file.strategy.max = 5
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flink-jmx-exporter
  namespace: flink
  labels:
    app: flink
data:
  config.yaml: |
    hostPort: 127.0.0.1:9999
    startDelaySeconds: 0
    ssl: false
    lowercaseOutputName: false
    lowercaseOutputLabelNames: false
    rules:
      - pattern: ".*"
---
apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
  namespace: flink
  labels:
    app: flink
    component: jobmanager
spec:
  type: ClusterIP
  selector:
    app: flink
    component: jobmanager
  ports:
    - name: rpc
      port: 6123
      targetPort: 6123
    - name: blob-server
      port: 6124
      targetPort: 6124
    - name: webui
      port: 8081
      targetPort: 8081
    - name: metrics
      port: 9404
      targetPort: 9404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-jobmanager
  namespace: flink
  labels:
    app: flink
    component: jobmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink
      component: jobmanager
  template:
    metadata:
      labels:
        app: flink
        component: jobmanager
    spec:
      initContainers:
        - name: init-logs
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /var/log/flink && chmod 777 /var/log/flink
          volumeMounts:
            - name: logs
              mountPath: /var/log/flink
        - name: install-connectors
          image: curlimages/curl:8.5.0
          command: ["/bin/sh", "-c", "/scripts/install-connectors.sh >> /var/log/flink/bootstrap.log 2>&1"]
          volumeMounts:
            - name: flink-usrlib
              mountPath: /opt/flink/usrlib
            - name: connector-init
              mountPath: /scripts
            - name: logs
              mountPath: /var/log/flink
        - name: fetch-jmx-exporter
          image: curlimages/curl:8.5.0
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              curl -fsSL -o /jmx/jmx_prometheus_httpserver.jar \
                https://repo1.maven.org/maven2/io/prometheus/jmx/jmx_prometheus_httpserver/1.0.1/jmx_prometheus_httpserver-1.0.1.jar
          volumeMounts:
            - name: jmx-jar
              mountPath: /jmx
      containers:
        - name: jobmanager
          image: apache/flink:2.3.0-java17
          command: ["/bin/bash", "-c"]
          args:
            - |
              sh /scripts/copy-to-lib.sh >> /var/log/flink/bootstrap.log 2>&1
              exec /docker-entrypoint.sh jobmanager
          ports:
            - containerPort: 6123
              name: rpc
            - containerPort: 6124
              name: blob-server
            - containerPort: 8081
              name: webui
          readinessProbe:
            httpGet:
              path: /overview
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6123
            initialDelaySeconds: 30
            periodSeconds: 60
          volumeMounts:
            - name: flink-config-volume
              mountPath: /opt/flink/conf
            - name: flink-usrlib
              mountPath: /opt/flink/usrlib
            - name: connector-init
              mountPath: /scripts
            - name: logs
              mountPath: /var/log/flink
          securityContext:
            runAsUser: 9999
          resources:
            requests:
              memory: "768Mi"
              cpu: "250m"
            limits:
              memory: "1280Mi"
              cpu: "1000m"
        - name: jmx-exporter
          image: eclipse-temurin:17-jre-jammy
          command:
            - java
            - -jar
            - /jmx/jmx_prometheus_httpserver.jar
            - "9404"
            - /etc/jmx-exporter/config.yaml
          ports:
            - containerPort: 9404
              name: metrics
          volumeMounts:
            - name: jmx-exporter-config
              mountPath: /etc/jmx-exporter
            - name: jmx-jar
              mountPath: /jmx
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
        - name: log-sync
          image: minio/mc:RELEASE.2025-04-16T18-13-26Z
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: accesskey
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secretkey
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              until mc alias set minio http://minio.minio.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "waiting for minio"
                sleep 5
              done
              mc mb minio/warehouse --ignore-existing
              while true; do
                for f in /var/log/flink/*; do
                  [ -f "$f" ] || continue
                  mc cp "$f" "minio/warehouse/logs/flink/${POD_NAME}/$(basename "$f")" || true
                done
                sleep 15
              done
          volumeMounts:
            - name: logs
              mountPath: /var/log/flink
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: flink-config-volume
          configMap:
            name: flink-config
            items:
              - key: config.yaml
                path: config.yaml
              - key: log4j-console.properties
                path: log4j-console.properties
        - name: flink-usrlib
          emptyDir: {}
        - name: jmx-jar
          emptyDir: {}
        - name: jmx-exporter-config
          configMap:
            name: flink-jmx-exporter
        - name: connector-init
          configMap:
            name: flink-connector-init
            defaultMode: 0755
            items:
              - key: install-connectors.sh
                path: install-connectors.sh
              - key: copy-to-lib.sh
                path: copy-to-lib.sh
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: flink-taskmanager
  namespace: flink
  labels:
    app: flink
    component: taskmanager
spec:
  selector:
    app: flink
    component: taskmanager
  ports:
    - name: rpc
      port: 6122
      targetPort: 6122
    - name: metrics
      port: 9404
      targetPort: 9404
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flink
  namespace: flink
  labels:
    app: flink
    release: kube-prometheus
spec:
  selector:
    matchLabels:
      app: flink
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
