              - key: log4j-console.properties
                path: log4j-console.properties
        - name: flink-usrlib
          emptyDir: {}
        - name: connector-init
          configMap:
            name: flink-connector-init
            defaultMode: 0755
            items:
              - key: install-connectors.sh
                path: install-connectors.sh
              - key: copy-to-lib.sh
                path: copy-to-lib.sh
